name: Tag and Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag-and-release:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write   # lets this job request a GitHub OIDC token for the release-notes step

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          VERSION="v${BRANCH#release/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --target main \
            --generate-notes \
            --title "${{ steps.version.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes draft
        continue-on-error: true
        run: node .github/workflows/files/generate-release-notes.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEW_VERSION: ${{ steps.version.outputs.version }}
          MAIN_REPO_PATH: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gemini summary
        uses: actions/upload-artifact@v4
        with:
          name: gemini-summary
          path: .github/workflows/files/gemini-summary.json

